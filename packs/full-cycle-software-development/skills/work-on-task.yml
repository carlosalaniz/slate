description: Implement one task, test-first, within its scope.
reads: ["stories/{story}/TDD.md", "stories/{story}/tasks.yaml", "specs/tech-spec.md", "tasks/{task}/design-{round.design}/verdict-*.md", "tasks/{task}/design-{round.design}/tests-*.md"]
prompt: |
  Implement task {task} of story {story} following the TDD and the task's scope. Write tests first,
  make them pass, run the full test command from the tech spec. If an earlier round of this design
  left a verdict (`tasks/{task}/design-{round.design}/verdict-*.md`) or a failed test run
  (`tasks/{task}/design-{round.design}/tests-*.md`), fix everything the latest failure reports.
  Finish by writing `tasks/{task}/design-{round.design}/build-{round}.md`: what changed (files), how
  to run the tests, known gaps.
