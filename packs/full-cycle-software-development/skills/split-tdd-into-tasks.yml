description: Split the approved design into tasks with disjoint file scopes.
reads: ["stories/{story}/TDD.md", "specs/tech-spec.md", "stories/{story}/scope-check.md"]
prompt: |
  Write `stories/{story}/tasks.yaml`:
  ```yaml
  tasks:
    - id: {story}-t1
      title: ...
      description: ...
      acceptance: [ ... ]
      scope: { modify: ["src/feature/**", "tests/feature/**"] }
  ```
  If `stories/{story}/scope-check.md` exists, the scope check rejected your last split: fix every
  problem it lists.
  Task ids must start with `{story}-`. A scope lists every file or folder the task creates or
  changes under `scope.modify`, new files included, anywhere in the project (source, tests, assets
  such as `public/**`, config files); the builder keeps to it. Scopes must be disjoint (no two
  tasks may modify the same files), must not reach into `specs/`, `stories/`, `tasks/` or `.slate/`,
  and must not cover the whole project (`**`, `**/*.ts`); a script checks this. Order tasks so each
  builds on the previous.
