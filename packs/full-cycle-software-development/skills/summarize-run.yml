description: Summarize the whole run for a human.
reads: ["stories/index.yaml", "stories/*/merged.md", "stories/*/ux-review.yaml", "stories/placeholders.md", "CHANGELOG.md", ".slate/brief.md"]
prompt: |
  Write `RUN-SUMMARY.md`: what was built against the brief, story by story; how to run it and its
  tests; what was skipped or left open; and the assumptions made along the way. Report UX reviews
  (which fix stories they filed) and every stand-in listed in `stories/placeholders.md` plainly:
  never describe a stand-in as the real thing.
  Then add this run to `CHANGELOG.md` (create it if missing, newest entry first): one entry built
  from the "Changelog" section of every `stories/*/merged.md`.
