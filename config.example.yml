# Slate project configuration.
#
# Copy this file to `slate.config.yml` in the root of the project you want to run,
# or generate one with `slate init`. Every key is optional; the defaults are shown.
#
#   cp config.example.yml slate.config.yml
#   slate start --idea "an offline todo web app"

# Project name. Used for the job id and in logs.
name: my-app

# Model provider. OpenCode reads the matching API key from the environment,
# e.g. ANTHROPIC_API_KEY for "anthropic", OPENAI_API_KEY for "openai".
provider: anthropic

# Which model each tier maps to. Packs never name models; they ask for a tier.
models:
  low: claude-haiku-4-5-20251001      # cheap, fast: intake, pack choice, reviewers
  medium: claude-sonnet-5             # default: most skill steps
  high: claude-opus-5-5               # expensive: design, tricky work

# Cost caps in USD. 0 means no cap. Hitting a cap stops the job at the next step
# boundary; raise the cap here, then `slate continue`.
budget:
  job: 200            # whole job
  per_task: 5         # per task
  per_model: {}       # e.g. { "anthropic/claude-opus-5-5": 50 }

# How the job behaves when it needs a human and none is around.
autonomy:
  # How long a question waits before the timeout policy below applies.
  question_timeout_hours: 8
  # keep-waiting: wait forever | take-default: pick the default option | escalate: keep waiting but log loudly
  on_timeout: keep-waiting
  # true = answer every approval and pack proposal with the default (unattended mode).
  auto_approve: false

# Which workflow pack to use. Omit to let intake propose one from the installed packs.
# pack: full-cycle-software-development@0.1.0

# OpenCode SDK version this project targets.
opencode: 2.0.15

# Runtime tuning.
runtime:
  step_timeout_minutes: 90    # how long one agent step may run before it is interrupted
  infra_retries: 3            # provider/infra failures retried before the job stops
  contract_reprompts: 1       # times a step is re-prompted when its output contract is missed
  worktrees: git              # git | copy | none — isolation for `as: task` build steps

# Pack-specific config. These override the pack's own defaults and fill `${config}`
# placeholders in the pack. The keys below are the reference pack's; your pack may differ.
config:
  on_exhausted: ask-human     # ask-human | ask-decision-agent | fail
  max_plan_rounds: 3          # plan rewrites after a rejection
  max_tdd_rounds: 3           # TDD review rounds per story
  max_build_rounds: 3         # build/verify rounds per task
  max_designs: 2              # design + redesigns per story
  max_stories: 50
  max_tasks_per_story: 20
  story_concurrency: 1        # stories built in parallel